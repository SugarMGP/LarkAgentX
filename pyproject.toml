[project]
name = "larkx"
version = "2.0.0"
description = "LarkX core client for Feishu web protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.31.0",
    "websockets>=15.0.1",
    "protobuf>=5.29.3",
    "protobuf3-to-dict>=0.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["larkx"]

[tool.hatch.build.targets.wheel.force-include]
"larkx/proto/cmd_map.json" = "larkx/proto/cmd_map.json"
