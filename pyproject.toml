[project]
name = "larkx"
version = "2.3.0"
description = "LarkX core client for Feishu web protocol"
authors = [{ name = "SugarMGP", email = "2350745751@qq.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.31.0",
    "websockets>=15.0.1",
    "protobuf>=5.29.3,<6",
    "protobuf3-to-dict>=0.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larkx"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
